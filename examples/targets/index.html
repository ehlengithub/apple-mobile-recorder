<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九点点击测试</title><style>body{margin:0;background:#f1f5f2;font:16px system-ui;color:#173b2c}header{padding:16px;text-align:center}main{height:75vh;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:15px;padding:12px}button{font:700 24px system-ui;color:#176744;border:2px solid #7cb494;background:white;border-radius:12px}button:active{background:#9de1b2}p{margin:6px}</style><header><b>安全测试页 · 点击九个按钮</b><p id="count">已收到 0 次点击</p><p id="last">只用于测试，不涉及真实业务操作</p></header><main></main><script>let count=0;for(let i=1;i<=9;i++){const b=document.createElement('button');b.textContent=i;b.addEventListener('click',()=>{document.querySelector('#count').textContent=`已收到 ${++count} 次点击`;document.querySelector('#last').textContent=`上次：按钮 ${i}`;});document.querySelector('main').append(b);}</script></html>
