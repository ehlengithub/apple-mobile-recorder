[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidagent"
version = "0.2.0"
description = "Record Apple mobile device clicks on a computer and generate standalone ESP32-S3 firmware"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pillow>=10", "python-dotenv>=1", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
iphone-agent = "hidagent.cli:main"
apple-recorder = "hidagent.workbench:main"

[project.urls]
Homepage = "https://github.com/ehlengithub/apple-mobile-recorder"

[tool.setuptools]
packages = ["hidagent"]

[tool.setuptools.package-data]
hidagent = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701"]  # one-line `case` arms keep the action dispatch compact

[tool.pytest.ini_options]
testpaths = ["tests"]
